[package]
name = "ui-core"
version = "0.1.0"
edition = "2024"
description = "몽땅클립보드 단축키 창 기술(Win32 직접·GDI 이중 버퍼·IME·순수 상태 기계)로 만든 공용 화면 부품"
license = "MIT"
publish = false

# 순수 함수(배치·목록·입력·폼·표·테마 결정)는 Win32 없이 시험한다. Win32 부분은 windows-sys만 쓴다.
[lib]
name = "ui_core"
path = "src/lib.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
