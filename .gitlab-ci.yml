# 2026-11-09 공공 GitLab Runner 일괄 삭제 조치.
# Runner 복구 또는 대체 배포 경로 확정 전까지 파이프라인 자체를 만들지 않는다.
# GitHub Actions의 Windows 빌드·시험 및 태그 릴리스 경로는 별도로 유지한다.
workflow:
  rules:
    - when: never

# visible placeholder로 설정 파일의 job 구성을 유지하되, 규칙상 실행하지 않는다.
runner-suspension-placeholder:
  stage: .pre
  script:
    - echo "GitLab Runner 복구 또는 대체 실행 경로 확정 전까지 중지합니다."
  rules:
    - when: never
