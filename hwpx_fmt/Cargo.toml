[package]
name = "hwpx_fmt"
version = "0.1.0"
edition = "2021"
publish = false
description = "HWPX 직접 처리기 Rust 이식 프로토타입(RSXML1): 표 두 글자 칸, 표 날짜 칸 한 줄"

[workspace]

[lib]
name = "hwpx_fmt"
path = "src/lib.rs"

[[bin]]
name = "hwpx_fmt"
path = "src/main.rs"

[dependencies]
quick-xml = "0.41"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
