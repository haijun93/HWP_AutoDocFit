[package]
name = "pdf_edit_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "경량 오프라인 PDF 페이지 편집 코어"

[dependencies]
lopdf = "0.34"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "pdf-edit"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
