[package]
name = "kfind-engine-bench"
version = "0.1.0"
edition = "2024"
description = "IS-S1 본문 문장 검색 엔진 비교 시제품: (A) Tantivy 대 (B) fst+roaring 직접 구현. 앱 코드가 아니다."
license-file = "../LICENSE"
publish = false

# 저장소 다른 크레이트의 작업 공간에 묶이지 않게 독립 작업 공간으로 둔다.
[workspace]

[dependencies]
# klib과 같은 판(0.27.0). 라이선스는 docs/IS_S1_ENGINE_COMPARE_2026-11-12.md 참고(MIT/Apache만).
tantivy = "=0.27.0"
fst = "=0.4.7"
roaring = "=0.12.0"
memmap2 = "=0.9.12"
memchr = "2.8"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
