[package]
name = "kb1-bench"
version = "0.1.0"
edition = "2024"
description = "KB1 비교 측정 전용: kfind-core 대 Tantivy(2글자 n-gram) 대 SeekStorm. 본 제품 의존성이 아니다."
license = "MIT"
publish = false

[workspace]

[dependencies]
kfind-core = { path = "../../kfind/core" }
tantivy = "=0.27.0"
seekstorm = { version = "=4.0.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
