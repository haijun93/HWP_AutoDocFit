[package]
name = "outliner_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline Markdown outliner engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-segmentation = "=1.10.0"

[[bin]]
name = "outliner"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
