[package]
name = "kfind"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
kfind-core = { path = "../../kfind/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory"] }
[dev-dependencies]
tempfile = "3"
