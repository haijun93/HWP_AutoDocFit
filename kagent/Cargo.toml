[package]
name = "kagent"
version = "0.1.1"
edition = "2024"
description = "K에이전트: 몽땅클립보드 기록·빠른 붙여넣기 상주 프로그램(초경량, 네트워크 코드 없음)"
license = "MIT"
publish = false

# 플랫폼 독립 분류 규칙 코어만 따로 시험하는 라이브러리 목표(맥/리눅스에서 `cargo test --lib`).
# 실행 파일(main.rs)은 같은 파일을 `mod category;`로 쓴다. 의존성 추가 없음.
[lib]
name = "kagent_category"
path = "src/category.rs"
crate-type = ["rlib"]

[[bin]]
name = "kagent"
path = "src/main.rs"

[dependencies]
# Win32 바인딩(순수 Rust, 빌드 스크립트·C 컴파일러 없음).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# 클립보드 비트맵(DIB) ↔ PNG. 순수 Rust.
png = "0.17"
# 썸네일 디스크 캐시 형식(KCAP3: PNG보다 작고 빨리 풀림). MIT OR Apache-2.0, 의존성 없음.
qoi = { version = "0.4", default-features = false, features = ["alloc"] }
regex = "1.13.1"
# 공용 색 표(밝게·어둡게·고대비)와 Windows 테마 감지(RUSTALL1 DARK1).
ui_theme = { path = "../ui_theme" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 시험(디버그) 빌드도 가볍게 최적화한다 — 썸네일 속도 시험(디버그 2초 한도)이 전체 시험 부하에서 흔들리지 않게(KCAP3).
# 넘침 검사·debug_assert는 opt-level과 별개라 그대로 켜져 있다. 의존성(png 해독 등)은 더 최적화.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
