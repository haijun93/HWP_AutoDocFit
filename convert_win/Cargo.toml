[package]
name = "convert_win"
version = "0.1.0"
edition = "2024"
description = "몽땅파일변환 Win32 창 1단계: 파일 드롭·목록·변환 대상 선택·캡처"
license = "MIT"
publish = false

[workspace]

[dependencies]
ui_theme = { path = "../ui_theme" }
grid_core = { path = "../grid_core" }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[[bin]]
name = "convert_win"
path = "src/main.rs"
