[package]
name = "kagent_thumb_bench"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "KCAP3 썸네일 후보 측정(합성 그림만, 사용자 파일 사용 금지)"

[workspace]

[dependencies]
png = "0.17"
zune-png = "0.4"
zune-core = "0.4"
fast_image_resize = "5"
qoi = "0.4"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
jpeg-encoder = "0.6"
jpeg-decoder = { version = "0.3", default-features = false }
zune-jpeg = "0.4"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_System_Memory"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
