<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Usage Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c30;--line:#283653;--muted:#9eacc4;--text:#edf3ff;--blue:#78aaff;--red:#ff657a;--green:#53d6a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#182742,var(--bg) 62%);color:var(--text);font:15px/1.5 system-ui,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:34px 22px 60px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}h1{font-size:28px;margin:0}h2{font-size:18px;margin:0 0 14px}.sub,.muted{color:var(--muted);font-size:13px}.section{margin-top:26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{background:linear-gradient(145deg,#18233a,#111a2d);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 10px 30px #0002}.name{font-size:16px;font-weight:700;margin-bottom:8px}.status{font-size:12px;color:var(--muted);margin-bottom:14px}.metric{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #26334a}.metric b{font-variant-numeric:tabular-nums}.bar{height:6px;background:#28354a;border-radius:9px;overflow:hidden;margin:7px 0 11px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4a91ff,#72d6c0);border-radius:9px}.danger{color:var(--red)!important}.danger .bar i{background:var(--red)}.badge{display:inline-block;border:1px solid #345176;color:#b8d5ff;border-radius:20px;padding:3px 8px;font-size:11px;margin:3px 4px 0 0}.worker{padding:7px 0;border-top:1px solid #26334a;font-size:12px;overflow-wrap:anywhere}.footer{margin-top:24px;color:var(--muted);font-size:12px}a{color:var(--blue)}
</style></head><body><main class="wrap"><header><div><h1>Worker Usage</h1><div class="sub">로컬 사용량 스냅샷 · 30초 수집 / 5초 갱신</div></div><div id="updated" class="muted">데이터 대기 중</div></header>
<section class="section"><h2>Codex · 계정 한도</h2><div id="codex" class="grid"></div></section>
<section class="section"><h2>Claude · 세션 토큰 합계</h2><div id="claude" class="grid"></div></section>
<section class="section"><h2>Gemini (agy) · 워커 로그</h2><div id="gemini" class="grid"></div></section><div class="footer">이 페이지는 127.0.0.1에서만 열립니다. 데이터는 이 컴퓨터의 usage.json에만 저장됩니다.</div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Date(s).toLocaleString():'—';
function usageBar(label,item){if(!item)return `<div class="metric"><span>${label}</span><b>제공 안 됨</b></div>`;const n=Math.max(0,Math.min(100,Number(item.used_percent)||0));return `<div class="metric"><span>${label}</span><b>${n.toFixed(1)}%</b></div><div class="bar"><i style="width:${n}%"></i></div><div class="muted">초기화 ${date(item.resets_at?item.resets_at*1000:null)} · ${item.window_minutes??'?'}분 창</div>`}
async function refresh(){try{const r=await fetch('usage.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('수집기 초기화 중');const d=await r.json();document.querySelector('#updated').textContent='수집 '+date(d.collected_at);document.querySelector('#codex').innerHTML=(d.codex||[]).map(x=>`<article class="card"><div class="name">${esc(x.name)}</div><div class="status">${esc(x.status)}</div>${usageBar('5시간',x.primary)}${usageBar('7일',x.secondary)}</article>`).join('');document.querySelector('#claude').innerHTML=(d.claude||[]).map(x=>`<article class="card ${x.alert?'danger':''}"><div class="name">${esc(x.name)}</div><div class="status">${esc(x.status)}</div><div class="metric"><span>5시간 입력·출력 합계</span><b>${Number(x.tokens_5h||0).toLocaleString()}</b></div><div class="metric"><span>7일 입력·출력 합계</span><b>${Number(x.tokens_7d||0).toLocaleString()}</b></div><div class="metric"><span>최근 세션 수</span><b>${x.sessions_7d||0}</b></div><div class="muted">정확한 한도 %는 로컬에서 제공되지 않음 · 추정</div></article>`).join('');document.querySelector('#gemini').innerHTML=(d.gemini||[]).map(x=>`<article class="card ${x.alert?'danger':''}"><div class="name">${esc(x.name)}</div><div class="status">한도 사용률: 제공 안 됨 · 최근 7일 실행 ${x.runs||0}건</div><div class="metric"><span>최근 한도/429 로그</span><b>${date(x.limit_at)}</b></div>${x.limit_log?`<div class="muted">감지 파일 ${esc(x.limit_log)}</div>`:''}<div style="margin-top:10px">${(x.workers||[]).map(w=>`<span class="badge">${esc(w.name)}</span>`).join('')||'<span class="muted">최근 worker 로그 없음</span>'}</div>${(x.workers||[]).slice(0,5).map(w=>`<div class="worker">${esc(w.log)} · ${date(w.modified)}</div>`).join('')}</article>`).join('')}catch(e){document.querySelector('#updated').textContent=e.message}}
refresh();setInterval(refresh,5000);
</script></body></html>
