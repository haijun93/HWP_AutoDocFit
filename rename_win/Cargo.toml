[package]
name = "rename_win"
version = "0.1.0"
edition = "2024"
description = "파일명 변경 Win32 창 3단계: 파일 선택·드롭·규칙 입력, 미리보기, 실제 이름 변경 적용과 저널 되돌리기"
publish = false

[workspace]

[dependencies]
ui_theme = { path = "../ui_theme" }
grid_core = { path = "../grid_core" }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode", "perf"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader",
  "Win32_System_Memory", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[[bin]]
name = "rename_win"
path = "src/main.rs"
