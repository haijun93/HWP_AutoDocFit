[package]
name = "mdm-ctx"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "mdm-ctx"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
