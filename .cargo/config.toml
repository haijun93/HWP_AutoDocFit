# Windows용 Rust 실행 파일·DLL에 C 런타임을 정적으로 넣는다(v2.2.65 설치 오류 수정, 2026-11-14).
# 기본(동적)이면 ktm.exe·kagent.exe·klib.exe·kfind.exe 등이 시스템의 VCRUNTIME140.dll을 찾는다.
# VC++ 재배포 패키지가 없는 PC에서는 설치 마지막 단계의 `ktm.exe --install`이 "VCRUNTIME140.dll이(가) 없어"로 멈추고,
# 앱이 띄운 도우미가 _internal\VCRUNTIME140.dll을 붙잡아 다음 설치에서 "DeleteFile 실패; 코드 5"가 난다.
# CI와 빌드 스크립트는 저장소 루트에서 `cargo ... --manifest-path <크레이트>/Cargo.toml`로 부르므로 이 설정이 모든 크레이트에 적용된다.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
